name: "CLA Assistant"

on:
  workflow_dispatch: # Manual trigger only

jobs:
  CLAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/your-org/odoo-project/blob/main/CLA.md"
          branch: "main"
          allowlist: dependabot[bot],github-actions[bot],odoo-bot
